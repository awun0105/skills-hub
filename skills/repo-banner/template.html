<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Source of the README banner. Render: render.sh banner.html banner.png 1600 500 1.5
     Fill in: fonts (the <link>), the :root colours, the title / tagline, and ONE visual
     variant in .visual (keep the one you use, delete the others). -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Work+Sans:wght@500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-1: #3a2f22;      /* glow behind the visual */
    --bg-2: #1b1712;      /* main background */
    --bg-3: #12100d;      /* edges */
    --ink: #F2EEDF;       /* title */
    --muted: #CFC6B1;     /* tagline */
    --accent: #E1A4C2;    /* accent word in the title */
    --accent-2: #D6DD63;  /* the short rule */
    --title-font: "Cormorant Garamond", Georgia, serif;
    --body-font: "Work Sans", system-ui, sans-serif;
    --mono-font: "JetBrains Mono", ui-monospace, monospace;
    --W: 1600px; --H: 500px;
  }
  html, body { margin: 0; }
  body { width: var(--W); height: var(--H); overflow: hidden; position: relative; color: var(--ink); font-family: var(--body-font);
    background: radial-gradient(ellipse at 78% 40%, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%); }
  /* Fine grain so the background isn't flat. Remove for a clean / corporate look. */
  .grain { position: absolute; inset: 0; opacity: .08; background-image: radial-gradient(#fff .6px, transparent .6px); background-size: 4px 4px; }

  .text { position: absolute; left: 110px; top: 50%; transform: translateY(-52%); max-width: 760px; }
  h1 { font-family: var(--title-font); font-weight: 500; font-size: 176px; line-height: .9; margin: 0; letter-spacing: -.02em; white-space: nowrap; }
  h1 em { font-style: italic; color: var(--accent); }
  .rule { width: 120px; height: 6px; border-radius: 3px; background: var(--accent-2); margin: 34px 0 22px; }
  .tagline { margin: 0; font-size: 25px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }

  .visual { position: absolute; right: 70px; top: 0; width: 760px; height: var(--H); }

  /* Variant A — screenshots fanned like cards on a table (apps, sites, templates, UIs) */
  .cards img { position: absolute; width: 430px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px;
    box-shadow: 0 24px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }

  /* Variant B — terminal + code cards (CLIs, libraries, SDKs) */
  .panel { position: absolute; border-radius: 14px; overflow: hidden; font: 20px/1.6 var(--mono-font);
    box-shadow: 0 24px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
  .panel .bar { height: 34px; display: flex; gap: 8px; align-items: center; padding: 0 14px; background: rgba(255,255,255,.07); }
  .panel .bar i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.25); }
  .panel pre { margin: 0; padding: 18px 22px; white-space: pre; }
  .term { left: 10px; top: 60px; width: 540px; background: #0e0d0b; transform: rotate(-4deg); }
  .code { left: 270px; top: 262px; width: 470px; background: #f6f2e6; color: #2a241b; transform: rotate(3deg); }
  .k { color: var(--accent); } .s { color: var(--accent-2); } .c { opacity: .55; } .p { color: var(--muted); }
  .code .k { color: #b5487e; } .code .s { color: #6b7a1f; }
  .code .bar { background: rgba(0,0,0,.06); } .code .bar i { background: rgba(0,0,0,.22); }

  /* Variant C — abstract shapes (when there is nothing to show) */
  .shapes span { position: absolute; border-radius: 50%; mix-blend-mode: screen; opacity: .9; }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="text">
    <h1>project <em>name</em></h1>
    <div class="rule"></div>
    <p class="tagline">one-line tagline</p>
  </div>

  <!-- Variant A: 3–4 real screenshots (relative paths from this file), varied in colour -->
  <div class="visual cards">
    <img src="../screenshots/one.png" style="left:20px; top:62px; transform: rotate(-7deg)">
    <img src="../screenshots/two.png" style="left:290px; top:46px; transform: rotate(5deg)">
    <img src="../screenshots/three.png" style="left:70px; top:212px; transform: rotate(3deg)">
    <img src="../screenshots/four.png" style="left:320px; top:222px; transform: rotate(-4deg)">
  </div>

  <!-- Variant B: the real install command / output and a real usage snippet
  <div class="visual">
    <div class="panel term"><div class="bar"><i></i><i></i><i></i></div><pre><span class="p">$</span> npm install <span class="s">project-name</span>
<span class="c">added 1 package in 2s</span>
<span class="p">$</span> project-name build
<span class="s">✓</span> done in 0.4s</pre></div>
    <div class="panel code"><div class="bar"><i></i><i></i><i></i></div><pre><span class="k">import</span> { thing } <span class="k">from</span> <span class="s">'project-name'</span>

<span class="k">const</span> out = thing(<span class="s">'input'</span>)</pre></div>
  </div>
  -->

  <!-- Variant C: soft overlapping circles in the palette
  <div class="visual shapes">
    <span style="width:360px;height:360px;left:120px;top:40px;background:var(--accent)"></span>
    <span style="width:300px;height:300px;left:360px;top:150px;background:var(--accent-2)"></span>
    <span style="width:220px;height:220px;left:260px;top:250px;background:var(--muted)"></span>
  </div>
  -->
</body>
</html>
